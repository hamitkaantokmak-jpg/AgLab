yıf gizleme, çözülür</text><rect x="30.0" y="104.0" width="820.0" height="28.0" rx="0" class="fg-card" stroke-width="1"/><text x="38.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">5</text><text x="118.0" y="122.0" font-size="12" text-anchor="start" class="fg-t fg-mono">enable secret (eski IOS)</text><text x="578.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">MD5 karma: orta</text><rect x="30.0" y="132.0" width="820.0" height="28.0" rx="0" class="fg-ok" stroke-width="1"/><text x="38.0" y="150.0" font-size="12" text-anchor="start" class="fg-t">8</text><text x="118.0" y="150.0" font-size="12" text-anchor="start" class="fg-t fg-mono">enable algorithm-type sha256 secret …</text><text x="578.0" y="150.0" font-size="12" text-anchor="start" class="fg-t">PBKDF2: güçlü</text><rect x="30.0" y="160.0" width="820.0" height="28.0" rx="0" class="fg-ok" stroke-width="1"/><text x="38.0" y="178.0" font-size="12" text-anchor="start" class="fg-t">9</text><text x="118.0" y="178.0" font-size="12" text-anchor="start" class="fg-t fg-mono">enable algorithm-type scrypt secret …</text><text x="578.0" y="178.0" font-size="12" text-anchor="start" class="fg-t">scrypt: güçlü</text><text x="440.0" y="230.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: type 7, kasanın şifresini kâğıda ters yazmak; type 9, kasayı gerçekten kilitlemek</text></svg>

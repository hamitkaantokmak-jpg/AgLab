-t">MPLS</text><text x="238.0" y="94.0" font-size="12" text-anchor="start" class="fg-t">40 ms</text><text x="398.0" y="94.0" font-size="12" text-anchor="start" class="fg-t">%0,1</text><text x="558.0" y="94.0" font-size="12" text-anchor="start" class="fg-t">sağlıyor → ses buradan</text><rect x="30.0" y="104.0" width="820.0" height="28.0" rx="0" class="fg-card" stroke-width="1"/><text x="38.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">LTE</text><text x="238.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">90 ms</text><text x="398.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">%0,8</text><text x="558.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">yedek</text><text x="440.0" y="160.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: navigasyonun trafik yoğunluğunu görüp ambulansı en hızlı yola, kargoyu ucuz yola göndermesi</text><rect x="30.0" y="190.0" width="820.0" height="48.4" rx="8" class="fg-accent" stroke-width="1.2"/><text x="42.0" y="210.0" font-size="12" text-anchor="start" class="fg-t">Transport bağımsızlığı: internet, MPLS ve LTE aynı yönetimle, aynı politikayla birlikte kullanılır; pahalı hatlar yalnız gereken trafiğe</text><text x="42.0" y="226.2" font-size="12" text-anchor="start" class="fg-t">ayrılır.</text></svg>

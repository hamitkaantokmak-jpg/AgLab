/text><text x="440.0" y="230.0" font-size="12" text-anchor="middle" class="fg-t fg-ok-x fg-mono" font-weight="700">SNR = −58 − (−92) = 34 dB (ses/video için ≥ 25 dB)</text><text x="440.0" y="262.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: sesin &#x27;iki kat yüksek&#x27; olması ve &#x27;şu kadar desibel&#x27; olması</text></svg>

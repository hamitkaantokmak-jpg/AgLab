<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-labelledby="kablosuz-ileri-g5-t kablosuz-ileri-g5-d" class="fg"><title id="kablosuz-ileri-g5-t">AP&#x27;nin denetleyiciye katılması</title><desc id="kablosuz-ileri-g5-d">AP önce IP adresi alır, sonra WLC&#x27;yi keşfeder, seçer, DTLS ile şifreli kontrol kanalı kurar ve gerekirse yeni yazılımı indirip yeniden başlar. Takıldığı adım nedeni söyler.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><defs><marker id="fga-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--fig-line-strong,#8a94a3)"/></marker><marker id="fga-lns" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" style="fill:var(--fig-line-strong,#8a94a3)"/></marker></defs><rect x="20.0" y="40.0" width="152.0" height="90.0" rx="10" class="fg-accent" stroke-width="1.5"/><text x="96.0" y="81.8" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">1. IP</text><text x="96.0" y="98.7" font-size="11" text-anchor="middle" class="fg-t fg-m">DHCP / statik</text><line x1="172.0" y1="85.0" x2="192.0" y2="85.0" class="fg-ln" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ln)"/><rect x="192.0" y="40.0" width="152.0" height="90.0" rx="10" class="fg-v2" stroke-width="1.5"/><text x="268.0" y="81.8" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">2. Keşif</text><text x="268.0" y="98.7" font-size="11" text-anchor="middle" class="fg-t fg-m">yayın · option 43 · DNS</text><line x1="344.0" y1="85.0" x2="364.0" y2="85.0" class="fg-ln" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ln)"/><rect x="364.0" y="40.0" width="152.0" height="90.0" rx="10" class="fg-accent" stroke-width="1.5"/><text x="440.0" y="81.8" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">3. Seçim</text><text x="440.0" y="98.7" font-size="11" text-anchor="middle" class="fg-t fg-m">birincil / en az yük</text><line x1="516.0" y1="85.0" x2="536.0" y2="85.0" class="fg-ln" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ln)"/><rect x="536.0" y="40.0" width="152.0" height="90.0" rx="10" class="fg-v2" stroke-width="1.5"/><text x="612.0" y="81.8" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">4. Katılım</text><text x="612.0" y="98.7" font-size="11" text-anchor="middle" class="fg-t fg-m">DTLS · UDP 5246</text><line x1="688.0" y1="85.0" x2="708.0" y2="85.0" class="fg-ln" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ln)"/><rect x="708.0" y="40.0" width="152.0" height="90.0" rx="10" class="fg-accent" stroke-width="1.5"/><text x="784.0" y="81.8" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">5. İmaj + ayar</text><text x="784.0" y="98.7" font-size="11" text-anchor="middle" class="fg-t fg-m">indir · yeniden başla</text><text x="440.0" y="170.0" font-size="12" text-anchor="middle" class="fg-t fg-mono" font-weight="700">DNS adı: CISCO-CAPWAP-CONTROLLER.&lt;alan adı&gt;</text><text x="440.0" y="200.0" font-size="12" text-anchor="middle" class="fg-t fg-warn-x" font-weight="700">Takıldığı yer: keşif → option 43/DNS · katılım → portlar, saat (sertifika)</text><text x="440.0" y="232.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: yeni çalışanın önce adres alması, sonra müdürü bulması, kimliğini göstermesi, sonra talimatları alması</text></svg>

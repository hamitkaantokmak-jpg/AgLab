<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="ethernet-mac-arp-g1-t ethernet-mac-arp-g1-d" class="fg"><title id="ethernet-mac-arp-g1-t">Mektup ve zarf: IP paketi Ethernet çerçevesinin içinde</title><desc id="ethernet-mac-arp-g1-d">IP adresi mektubun son alıcısıdır ve yol boyunca değişmez; MAC adresi zarfın üstündeki bir sonraki el, her bağlantıda yeniden yazılır.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><text x="440.0" y="26.0" font-size="14" text-anchor="middle" class="fg-t" font-weight="700">Ethernet çerçevesi (zarf)</text><rect x="40.0" y="44.0" width="130.0" height="60.0" rx="4" class="fg-v3" stroke-width="1.5"/><text x="105.0" y="72.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Hedef MAC</text><text x="105.0" y="87.0" font-size="10" text-anchor="middle" class="fg-t fg-m">bir sonraki el</text><rect x="170.0" y="44.0" width="130.0" height="60.0" rx="4" class="fg-v3" stroke-width="1.5"/><text x="235.0" y="72.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Kaynak MAC</text><text x="235.0" y="87.0" font-size="10" text-anchor="middle" class="fg-t fg-m">gönderen kart</text><rect x="300.0" y="44.0" width="80.0" height="60.0" rx="4" class="fg-card" stroke-width="1.5"/><text x="340.0" y="72.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Tür</text><text x="340.0" y="87.0" font-size="10" text-anchor="middle" class="fg-t fg-m">0x0800 = IPv4</text><rect x="380.0" y="44.0" width="340.0" height="60.0" rx="4" class="fg-v1" stroke-width="1.5"/><text x="550.0" y="78.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">IP paketi (mektup)</text><rect x="720.0" y="44.0" width="80.0" height="60.0" rx="4" class="fg-card" stroke-width="1.5"/><text x="760.0" y="72.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">FCS</text><text x="760.0" y="87.0" font-size="10" text-anchor="middle" class="fg-t fg-m">hata denetimi</text><rect x="390.0" y="116.0" width="340.0" height="56.0" rx="6" class="fg-v1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="475.0" y="140.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Kaynak IP</text><text x="475.0" y="158.0" font-size="11" text-anchor="middle" class="fg-t fg-m fg-mono">192.168.10.11</text><text x="645.0" y="140.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Hedef IP</text><text x="645.0" y="158.0" font-size="11" text-anchor="middle" class="fg-t fg-m fg-mono">192.168.100.20</text><line x1="560.0" y1="104.0" x2="560.0" y2="116.0" class="fg-ln" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="40.0" y="190.0" width="380.0" height="65.2" rx="8" class="fg-v3" stroke-width="1.2"/><text x="52.0" y="210.0" font-size="12" text-anchor="start" class="fg-t fg-v3-x" font-weight="700">Zarf</text><text x="52.0" y="226.8" font-size="12" text-anchor="start" class="fg-t">MAC: yerel teslimat. Her bağlantıda (her switch&#x27;ten</text><text x="52.0" y="243.0" font-size="12" text-anchor="start" class="fg-t">router&#x27;a, router&#x27;dan router&#x27;a) değişir.</text><rect x="450.0" y="190.0" width="390.0" height="65.2" rx="8" class="fg-v1" stroke-width="1.2"/><text x="462.0" y="210.0" font-size="12" text-anchor="start" class="fg-t fg-v1-x" font-weight="700">Mektup</text><text x="462.0" y="226.8" font-size="12" text-anchor="start" class="fg-t">IP: son alıcı. Paket yol boyunca aynı kaynak ve hedef IP ile</text><text x="462.0" y="243.0" font-size="12" text-anchor="start" class="fg-t">gider (NAT hariç).</text></svg>

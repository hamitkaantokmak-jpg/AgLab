<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="iletim-mekanizmalari-g4-t iletim-mekanizmalari-g4-d" class="fg"><title id="iletim-mekanizmalari-g4-t">Adjacency tablosu: hazır zarf</title><desc id="iletim-mekanizmalari-g4-d">Her sonraki adım için Ethernet başlığı (hedef MAC, kaynak MAC, tür) önceden yazılmıştır. Paket gelince yalnız başlık değiştirilir, TTL azaltılır, sağlama toplamı güncellenir.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><text x="30.0" y="40.0" font-size="12" text-anchor="start" class="fg-t fg-m" font-weight="700">Adjacency&#x27;den hazır başlık + paket</text><rect x="30.0" y="50.0" width="170.0" height="60.0" rx="4" class="fg-v1" stroke-width="1.5"/><text x="115.0" y="78.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Hedef MAC</text><text x="115.0" y="93.0" font-size="10" text-anchor="middle" class="fg-t fg-m">next-hop&#x27;un MAC&#x27;i</text><rect x="200.0" y="50.0" width="170.0" height="60.0" rx="4" class="fg-v2" stroke-width="1.5"/><text x="285.0" y="78.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Kaynak MAC</text><text x="285.0" y="93.0" font-size="10" text-anchor="middle" class="fg-t fg-m">çıkış arayüzü</text><rect x="370.0" y="50.0" width="90.0" height="60.0" rx="4" class="fg-soft" stroke-width="1.5"/><text x="415.0" y="78.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Tür</text><text x="415.0" y="93.0" font-size="10" text-anchor="middle" class="fg-t fg-m">0800</text><rect x="460.0" y="50.0" width="360.0" height="60.0" rx="4" class="fg-accent" stroke-width="1.5"/><text x="640.0" y="78.0" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">IP paketi</text><text x="640.0" y="93.0" font-size="10" text-anchor="middle" class="fg-t fg-m">TTL−1, checksum</text><rect x="30.0" y="150.0" width="820.0" height="48.4" rx="8" class="fg-warn" stroke-width="1.2"/><text x="42.0" y="170.0" font-size="12" text-anchor="start" class="fg-t">Adjacency yoksa (ARP çözülmemiş) giriş &quot;glean&quot; olur: ilk paket CPU&#x27;ya gider, ARP sorulur, adjacency tamamlanınca paketler ASIC&#x27;te</text><text x="42.0" y="186.2" font-size="12" text-anchor="start" class="fg-t">akar.</text><text x="440.0" y="236.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: düzenli gönderdiğin adreslere önceden yazılmış zarflar; mektubu koyup postalarsın</text></svg>

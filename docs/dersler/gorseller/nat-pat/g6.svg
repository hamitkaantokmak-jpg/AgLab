fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><rect x="30.0" y="30.0" width="400.0" height="110.0" rx="10" class="fg-v1" stroke-width="1.5"/><text x="230.0" y="81.0" font-size="15" text-anchor="middle" class="fg-t" font-weight="700">Statik NAT</text><text x="230.0" y="100.5" font-size="13" text-anchor="middle" class="fg-t fg-m">192.168.10.20 ↔ 203.0.113.5 (bütün portlar)</text><rect x="450.0" y="30.0" width="400.0" height="110.0" rx="10" class="fg-v2" stroke-width="1.5"/><text x="650.0" y="81.0" font-size="15" text-anchor="middle" class="fg-t" font-weight="700">Port yönlendirme</text><text x="650.0" y="100.5" font-size="13" text-anchor="middle" class="fg-t fg-m">203.0.113.2:80 → 192.168.10.20:80</text><text x="230.0" y="170.0" font-size="11" text-anchor="middle" class="fg-t fg-mono">ip nat inside source static 192.168.10.20 203.0.113.5</text><text x="650.0" y="170.0" font-size="11" text-anchor="middle" class="fg-t fg-mono">ip nat inside source static tcp</text><text x="650.0" y="188.0" font-size="11" text-anchor="middle" class="fg-t fg-mono">192.168.10.20 80 203.0.113.2 80</text><text x="440.0" y="230.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Dinamik NAT: havuzdan (ip nat pool) sırayla adre
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="kampus-tasarim-g6-t kampus-tasarim-g6-d" class="fg"><title id="kampus-tasarim-g6-t">Aşırı abonelik (oversubscription)</title><desc id="kampus-tasarim-g6-d">Kullanıcıların hepsi aynı anda tam hızda göndermez; yukarı bağlantılar toplam erişim hızından küçük seçilir. Yaygın kural: erişimden dağıtıma en fazla 20:1, dağıtımdan çekirdeğe 4:1.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><defs><marker id="fga-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--fig-line-strong,#8a94a3)"/></marker><marker id="fga-lns" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" style="fill:var(--fig-line-strong,#8a94a3)"/></marker></defs><rect x="30.0" y="30.0" width="380.0" height="110.0" rx="10" class="fg-v1" stroke-width="1.5"/><text x="220.0" y="81.0" font-size="15" text-anchor="middle" class="fg-t" font-weight="700">48 × 1 Gbps erişim portu</text><text x="220.0" y="100.5" font-size="13" text-anchor="middle" class="fg-t fg-m">toplam 48 Gbps</text><line x1="410.0" y1="85.0" x2="470.0" y2="85.0" class="fg-ln" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ln)"/><rect x="470.0" y="30.0" width="380.0" height="110.0" rx="10" class="fg-v2" stroke-width="1.5"/><text x="660.0" y="81.0" font-size="15" text-anchor="middle" class="fg-t" font-weight="700">2 × 10 Gbps yukarı bağlantı</text><text x="660.0" y="100.5" font-size="13" text-anchor="middle" class="fg-t fg-m">toplam 20 Gbps → 48:20 = 2,4:1</text><rect x="30.0" y="170.0" width="820.0" height="48.4" rx="8" class="fg-accent" stroke-width="1.2"/><text x="42.0" y="190.0" font-size="12" text-anchor="start" class="fg-t">Benzetme: apartmandaki 48 dairenin hepsi aynı anda asansöre binmez; 2 asansör yeter. Ama bir video konferans salonu her gün aynı</text><text x="42.0" y="206.2" font-size="12" text-anchor="start" class="fg-t">saatte dolarsa hesap değişir.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="cdp-lldp-g2-t cdp-lldp-g2-d" class="fg"><title id="cdp-lldp-g2-t">CDP duyurusunun içinde ne var?</title><desc id="cdp-lldp-g2-d">Her 60 saniyede bir gönderilen küçük bir kartvizit: ad, model, yazılım sürümü, IP adresi ve duyurunun çıktığı port. Komşu bunu 180 saniye saklar.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fil
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="altyapi-guvenligi-g6-t altyapi-guvenligi-g6-d" class="fg"><title id="altyapi-guvenligi-g6-t">Altyapı ACL&#x27;si: router&#x27;ın kendisini koru</title><desc id="altyapi-guvenligi-g6-d">Ağın kenarında, dışarıdan gelen ve doğrudan altyapı adreslerine (router loopback&#x27;leri, yönetim ağı) yönelen trafik engellenir; yalnız gerekli protokollere (ör. komşu BGP, IPsec) izin verilir. Geçen kullanıcı trafiği etkilenmez.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><path d="M74.0 147.0 a16.7 16.7 0 0 1 -4.0 -29.7 a31.5 18.9 0 0 1 52.5 -20.2 a35.0 18.9 0 0 1 66.5 4.0 a18.9 18.9 0 0 1 17.5 45.9z" class="fg-card" stroke-width="1.5"/><text x="130.0" y="130.0" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">İnternet</text><rect x="365.0" y="88.0" width="150.0" height="64.0" rx="11" class="fg-card" stroke-width="1.5"/><circle cx="440" cy="103.0" r="8" class="fg-accent-s" stroke-width="1.6"/><path d="M435 103.0h10M440 98.0v10" class="fg-accent-s" stroke-width="1.6"/><text x="440.0" y="125.0" font-size="13" text-anchor="middle" class="fg-t" font-weight="700">Kenar router</text><text x="440.0" y="141.0" font-size="11" text-anchor="middle" class="fg-t fg-m">iACL girişte</text><rect x="685.0" y="93.0" width="130.0" height="54.0" rx="11" class="fg-card" stroke-width="1.5"/><rect x="738" y="102.0" width="24" height="12" rx="2" class="fg-accent-s" stroke-width="1.6"/><rect x="742" y="107.0" width="4" height="3" class="fg-accent-f"/><rect x="748" y="107.0" width="4" he
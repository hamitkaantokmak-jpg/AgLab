tart" class="fg-t fg-mono">192.168.100.10</text><text x="500.0" y="188.0" font-size="13" text-anchor="start" class="fg-t" font-weight="700">Süre</text><text x="620.0" y="188.0" font-size="13" text-anchor="start" class="fg-t fg-mono">1 gün (IOS varsayılanı)</text><text x="440.0" y="242.0" font-size="11" text-anchor="middle" class="fg-t fg-m">Benzetme: otel oda numarası, kahvaltı saatini ve wifi şifresini verir; oda çıkış gününe kadar senindir</text></svg>

nt-size="13" text-anchor="middle" class="fg-t" font-weight="700">PC-11</text><line x1="180.0" y1="200.0" x2="700.0" y2="200.0" class="fg-v2-s" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-v2)"/><text x="440.0" y="192.0" font-size="12" text-anchor="middle" class="fg-t fg-v2-x">NS: &quot;2001:db8:10::11 kimde?&quot; (solicited-node multicast)</text><line x1="700.0" y1="240.0" x2="180.0" y2="240.0" class="fg-ok-s" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ok)"/><text x="440.0" y="258.0" font-size="12" text-anchor="middle" class="fg-t fg-ok-x">NA: &quot;bende, MAC 0200.0000.0011&quot;</text><text x="440.0" y="296.0" font-size="12" text-anchor="middle" class="fg-t fg-err-x" font-weight="700">ICMPv6 bu yüzden tamamen engellenemez: NDP de ICMPv6&#x27;dır</text></svg>

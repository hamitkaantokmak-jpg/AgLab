<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="stp-g5-t stp-g5-d" class="fg"><title id="stp-g5-t">Klasik STP yavaş, RSTP hızlı</title><desc id="stp-g5-d">802.1D&#x27;de bir port forwarding&#x27;e geçmeden önce Listening ve Learning&#x27;de 15&#x27;er saniye bekler. RSTP (rapid-pvst) öneri ve anlaşma ile saniyeler içinde yakınsar.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><defs><marker id="fga-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--fig-ok,#1f9d6b)"/></marker><marker id="fga-oks" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" style="fill:var(--fig-ok,#1f9d6b)"/></marker></defs><text x="40.0" y="40.0" font-size="13" text-anchor="start" class="fg-t" font-weight="700">802.1D</text><rect x="120.0" y="20.0" width="150.0" height="40.0" rx="10" class="fg-err" stroke-width="1.5"/><text x="195.0" y="43.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Blocking</text><rect x="270.0" y="20.0" width="190.0" height="40.0" rx="10" class="fg-warn" stroke-width="1.5"/><text x="365.0" y="43.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Listening 15 sn</text><rect x="460.0" y="20.0" width="190.0" height="40.0" rx="10" class="fg-warn" stroke-width="1.5"/><text x="555.0" y="43.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Learning 15 sn</text><rect x="650.0" y="20.0" width="190.0" height="40.0" rx="10" class="fg-ok" stroke-width="1.5"/><text x="745.0" y="43.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Forwarding</text><text x="480.0" y="84.0" font-size="12" text-anchor="middle" class="fg-t fg-err-x">değişiklikte 30–50 saniye kesinti</text><text x="40.0" y="140.0" font-size="13" text-anchor="start" class="fg-t" font-weight="700">RSTP</text><rect x="120.0" y="120.0" width="220.0" height="40.0" rx="10" class="fg-err" stroke-width="1.5"/><text x="230.0" y="143.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Discarding</text><line x1="340.0" y1="140.0" x2="470.0" y2="140.0" class="fg-ok-s" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-ok)"/><text x="405.0" y="132.0" font-size="12" text-anchor="middle" class="fg-t fg-ok-x">öneri / anlaşma</text><rect x="470.0" y="120.0" width="370.0" height="40.0" rx="10" class="fg-ok" stroke-width="1.5"/><text x="655.0" y="143.6" font-size="12" text-anchor="middle" class="fg-t" font-weight="700">Forwarding (saniyeler)</text><rect x="40.0" y="190.0" width="800.0" height="32.2" rx="8" class="fg-accent" stroke-width="1.2"/><text x="52.0" y="210.0" font-size="12" text-anchor="start" class="fg-t">RSTP rolleri: Root, Designated, Alternate (yedek kök yolu), Backup. Cisco&#x27;da: spanning-tree mode rapid-pvst</text></svg>

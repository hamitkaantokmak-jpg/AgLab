" height="64.6" rx="8" class="fg-err" stroke-width="1.2"/><text x="52.0" y="40.0" font-size="12" text-anchor="start" class="fg-t">Her switch broadcast&#x27;i gelen port</text><text x="52.0" y="56.2" font-size="12" text-anchor="start" class="fg-t">dışındaki bütün portlara gönderir: kopya</text><text x="52.0" y="72.4" font-size="12" text-anchor="start" class="fg-t">çoğalır.</text><rect x="600.0" y="20.0" width="260.0" height="48.4" rx="8" class="fg-ok" stroke-width="1.2"/><text x="612.0" y="40.0" font-size="12" text-anchor="start" class="fg-t">STP&#x27;nin işi: bir kabloyu bloklayıp ağacı</text><text x="612.0" y="56.2" font-size="12" text-anchor="start" class="fg-t">döngüsüz yapmak.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="acl-g2-t acl-g2-d" class="fg"><title id="acl-g2-t">Sıra her şeydir</title><desc id="acl-g2-d">Genel bir deny özel bir permit&#x27;in üstündeyse permit&#x27;e hiç sıra gelmez. Özel satırlar üstte, genel satırlar altta olmalı.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><text x="220.0" y="34.0" font-size="14" text-anchor="middle" class="fg-t fg-err-x" font-weight="700">Yanlış</text><rect x="30.0" y="50.0" width="380.0" height="36.0" rx="6" class="fg-err" stroke-width="1.5"/><text x="42.0" y="73.0" font-size="12" text-anchor="start" class="fg-t fg-mono">10 deny ip 192.168.20.0 0.0.0.255 any</text><rect x="30.0" y="92.0" width="380.0" height="36.0" rx="6" class="fg-soft" stroke-width="1.5"/><text x="42.0" y="115.0" font-size="12" text-anchor="start" class="fg-t fg-m fg-mono">20 permit tcp ... host SRV eq www</text><text x="220.0" y="150.0" font-size="12" text-anchor="middle" class="fg-t fg-err-x">web isteği 10&#x27;da düşer; 20&#x27;ye hiç ulaşılmaz</text><text x="660.0" y="34.0" font-size="14" text-anchor="middle" class="fg-t fg-ok-x" font-weight="700">Doğru</text><rect x="470.0" y="50.0" width="380.0" height="36.0" rx="6" class="fg-ok" stroke-width="1.5"/><text x="482.0" y="73.0" font-size="12" text-anchor="start" class="fg-t fg-mono">10 permit tcp ... host SRV eq www</text><rect x="470.0" y="92.0" width="380.0" height="36.0" rx="6" class="fg-warn" stroke-width="1.5"/><text x="482.0" y="115.0" font-size="12" text-anchor="start" class="fg-t fg-mono">20 deny ip 192.168.20.0 0.0.0.255 any</text><text x="660.0" y="150.0" font-size="12" text-anchor="middle" class="fg-t fg-ok-x">özel izin önce, genel yasak sonra</text><rect x="30.0" y="180.0" width="820.0" height="32.2" rx="8" class="fg-accent" stroke-width="1.2"/><text x="42.0" y="200.0" font-size="12" text-anchor="start" class="fg-t">Düzeltme: ip access-list extended MISAFIR → no 10 (satırı sil) ya da 5 permit ... (araya, üste ekle). Sıra numaraları bunun için vardır.</text></svg>

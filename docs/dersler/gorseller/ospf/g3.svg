ass="fg-t">DIŞARIDA kalır</text><rect x="30.0" y="104.0" width="820.0" height="28.0" rx="0" class="fg-ok" stroke-width="1"/><text x="38.0" y="122.0" font-size="12" text-anchor="start" class="fg-t fg-mono">192.168.30.1 0.0.0.0 area 0</text><text x="348.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">tam eşleşme</text><text x="598.0" y="122.0" font-size="12" text-anchor="start" class="fg-t">OSPF&#x27;e girer</text><rect x="30.0" y="150.0" width="820.0" height="32.2" rx="8" class="fg-accent" stroke-width="1.2"/><text x="42.0" y="170.0" font-size="12" text-anchor="start" class="fg-t">Wildcard, maskenin tersidir: 0 = bu bit aynı olmalı, 1 = önemli değil. /24 için 0.0.0.255, /30 için 0.0.0.3 (Konu #19).</text><rect x="30.0" y="210.0" width="820.0" height="32.2" rx="8" class="fg-ok" stroke-width="1.2"/><text x="42.0" y="230.0" font-size="12" text-anchor="start" class="fg-t">Arayüz OSPF&#x27;e girince iki şey olur: o arayüzden Hello gönderilir ve arayüzün ağı ilan edilir.</text></svg>

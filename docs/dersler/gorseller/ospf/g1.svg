<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="ospf-g1-t ospf-g1-d" class="fg"><title id="ospf-g1-t">Statik mi OSPF mi?</title><desc id="ospf-g1-d">Statik rota her router&#x27;a elle yazılır ve hat düşünce kendiliğinden yol değiştirmez. OSPF&#x27;te router&#x27;lar ağlarını birbirine kendisi duyurur.</desc><style>.fg-t{fill:var(--fig-text,#1f2430);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.fg-m{fill:var(--fig-muted,#59606c)}.fg-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.fg-ln{stroke:var(--fig-line-strong,#8a94a3);fill:none}.fg-card{fill:var(--fig-card,#ffffff);stroke:var(--fig-line,#c9d1dc)}.fg-card-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-card-f{fill:var(--fig-line,#c9d1dc)}.fg-card-x{fill:var(--fig-line,#c9d1dc)}.fg-soft{fill:var(--fig-soft,#f2f4f7);stroke:var(--fig-line,#c9d1dc)}.fg-soft-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-soft-f{fill:var(--fig-line,#c9d1dc)}.fg-soft-x{fill:var(--fig-line,#c9d1dc)}.fg-accent{fill:var(--fig-accent-soft,#e5ecff);stroke:var(--fig-accent,#3b6cf6)}.fg-accent-s{stroke:var(--fig-accent,#3b6cf6);fill:none}.fg-accent-f{fill:var(--fig-accent,#3b6cf6)}.fg-accent-x{fill:var(--fig-accent,#3b6cf6)}.fg-ok{fill:var(--fig-ok-soft,#dff5ea);stroke:var(--fig-ok,#1f9d6b)}.fg-ok-s{stroke:var(--fig-ok,#1f9d6b);fill:none}.fg-ok-f{fill:var(--fig-ok,#1f9d6b)}.fg-ok-x{fill:var(--fig-ok,#1f9d6b)}.fg-err{fill:var(--fig-err-soft,#fde4e4);stroke:var(--fig-err,#d64545)}.fg-err-s{stroke:var(--fig-err,#d64545);fill:none}.fg-err-f{fill:var(--fig-err,#d64545)}.fg-err-x{fill:var(--fig-err,#d64545)}.fg-warn{fill:var(--fig-warn-soft,#fdf0d5);stroke:var(--fig-warn,#c98a12)}.fg-warn-s{stroke:var(--fig-warn,#c98a12);fill:none}.fg-warn-f{fill:var(--fig-warn,#c98a12)}.fg-warn-x{fill:var(--fig-warn,#c98a12)}.fg-v1{fill:var(--fig-v1-soft,#e3edff);stroke:var(--fig-v1,#2f6fe0)}.fg-v1-s{stroke:var(--fig-v1,#2f6fe0);fill:none}.fg-v1-f{fill:var(--fig-v1,#2f6fe0)}.fg-v1-x{fill:var(--fig-v1,#2f6fe0)}.fg-v2{fill:var(--fig-v2-soft,#dcf4e6);stroke:var(--fig-v2,#1d9a5b)}.fg-v2-s{stroke:var(--fig-v2,#1d9a5b);fill:none}.fg-v2-f{fill:var(--fig-v2,#1d9a5b)}.fg-v2-x{fill:var(--fig-v2,#1d9a5b)}.fg-v3{fill:var(--fig-v3-soft,#fde9d7);stroke:var(--fig-v3,#d9731a)}.fg-v3-s{stroke:var(--fig-v3,#d9731a);fill:none}.fg-v3-f{fill:var(--fig-v3,#d9731a)}.fg-v3-x{fill:var(--fig-v3,#d9731a)}.fg-v4{fill:var(--fig-v4-soft,#efe3fb);stroke:var(--fig-v4,#8a4fd0)}.fg-v4-s{stroke:var(--fig-v4,#8a4fd0);fill:none}.fg-v4-f{fill:var(--fig-v4,#8a4fd0)}.fg-v4-x{fill:var(--fig-v4,#8a4fd0)}.fg-none{fill:var(--fig-none,none);stroke:var(--fig-line,#c9d1dc)}.fg-none-s{stroke:var(--fig-line,#c9d1dc);fill:none}.fg-none-f{fill:var(--fig-line,#c9d1dc)}.fg-none-x{fill:var(--fig-line,#c9d1dc)}</style><rect x="40.0" y="30.0" width="380.0" height="190.0" rx="10" class="fg-warn" stroke-width="1.5"/><text x="230.0" y="66.0" font-size="16" text-anchor="middle" class="fg-t" font-weight="700">Statik</text><text x="230.0" y="120.0" font-size="12" text-anchor="middle" class="fg-t">Her yeni ağ = her router&#x27;a yeni satır</text><text x="230.0" y="136.2" font-size="12" text-anchor="middle" class="fg-t">Hat düşerse trafik kör kalır</text><text x="230.0" y="152.4" font-size="12" text-anchor="middle" class="fg-t">Küçük, değişmeyen ağlar için</text><rect x="460.0" y="30.0" width="380.0" height="190.0" rx="10" class="fg-ok" stroke-width="1.5"/><text x="650.0" y="66.0" font-size="16" text-anchor="middle" class="fg-t" font-weight="700">OSPF</text><text x="650.0" y="120.0" font-size="12" text-anchor="middle" class="fg-t">Router&#x27;lar ağlarını kendisi duyurur</text><text x="650.0" y="136.2" font-size="12" text-anchor="middle" class="fg-t">Hat düşerse yeni yol hesaplanır</text><text x="650.0" y="152.4" font-size="12" text-anchor="middle" class="fg-t">Büyüyen, yedekli ağlar için</text><text x="440.0" y="256.0" font-size="12" text-anchor="middle" class="fg-t fg-m">Benzetme: statik = kâğıt harita; OSPF = trafiği anlık gösteren navigasyon</text></svg>

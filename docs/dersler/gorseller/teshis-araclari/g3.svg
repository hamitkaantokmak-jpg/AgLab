ping 192.168.30.10 → kaynak 10.0.12.1 → !!!!!</text><line x1="320.0" y1="180.0" x2="750.0" y2="180.0" class="fg-err-s" stroke-width="2" stroke-linecap="round" marker-end="url(#fga-err)"/><text x="535.0" y="172.0" font-size="12" text-anchor="middle" class="fg-t fg-err-x">ping 192.168.30.10 source g0/0 → kaynak 192.168.10.1 → .....</text><rect x="30.0" y="220.0" width="820.0" height="32.2" rx="8" class="fg-warn" stroke-width="1.2"/><text x="42.0" y="240.0" font-size="12" text-anchor="start" class="fg-t">Sonuç: R2 ya da SRV tarafında 192.168.10.0/24&#x27;e dönüş yolu yok. Router&#x27;dan atılan başarılı ping &quot;ağ sağlam&quot; demek değildir.</text></svg>

xt x="542.0" y="50.0" font-size="12" text-anchor="start" class="fg-t">dict: { anahtar: değer }</text><rect x="530.0" y="90.0" width="320.0" height="32.2" rx="8" class="fg-v2" stroke-width="1.2"/><text x="542.0" y="110.0" font-size="12" text-anchor="start" class="fg-t">list: [ sıralı öğeler ], sıra 0&#x27;dan başlar</text><rect x="530.0" y="150.0" width="320.0" height="48.4" rx="8" class="fg-v3" stroke-width="1.2"/><text x="542.0" y="170.0" font-size="12" text-anchor="start" class="fg-t">True/False, sayı, metin: JSON&#x27;daki karşılıkları</text><text x="542.0" y="186.2" font-size="12" text-anchor="start" class="fg-t">true/false, sayı, &quot;metin&quot;</text></svg>

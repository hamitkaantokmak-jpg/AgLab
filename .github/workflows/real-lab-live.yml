name: Gerçek Lab canlı doğrulama (isteğe bağlı)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'real-lab/**'
      - '.github/workflows/real-lab-live.yml'

permissions:
  contents: read

jobs:
  live-containerlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Containerlab kur
        run: |
          curl -fsSL https://get.containerlab.dev | sudo bash
          containerlab version
      - name: Gerçek topolojiyi çalıştır ve ICMP doğrula
        run: sudo python3 real-lab/live_smoke.py --execute
      - name: Yetkisiz öğrenci hesabı ve Docker yalıtımını doğrula
        run: sudo python3 real-lab/student_isolation_smoke.py --execute
      - name: Canlı router tanısından öğrenci yanıtına tüm zinciri doğrula
        run: sudo python3 real-lab/student_live_smoke.py --execute
      - name: Artık konteyner kalmadığını kontrol et
        if: always()
        run: |
          sudo containerlab destroy -t real-lab/topology.clab.yml --cleanup || true
          remaining="$(sudo docker ps -a --format '{{.Names}}' | grep '^clab-aglab-real-mvp-' || true)"
          if [ -n "$remaining" ]; then
            echo "::error::Real-lab containers remain after cleanup:"
            echo "$remaining"
            exit 1
          fi
          echo "Real-lab cleanup verified"

name: Gerçek Lab canlı doğrulama (isteğe bağlı)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'real-lab/**'
      - '.github/workflows/real-lab-live.yml'

permissions:
  contents: read

jobs:
  live-containerlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Containerlab kur
        run: |
          curl -fsSL https://get.containerlab.dev | sudo bash
          containerlab version
      - name: Gerçek topolojiyi çalıştır ve ICMP doğrula
        run: sudo python3 real-lab/live_smoke.py --execute
      - name: Yetkisiz öğrenci hesabı ve Docker yalıtımını doğrula
        run: sudo python3 real-lab/student_isolation_smoke.py --execute
      - name: Canlı router tanısından öğrenci yanıtına tüm zinciri doğrula
        run: sudo python3 real-lab/student_live_smoke.py --execute
      - name: Artık konteyner kalmadığını kontrol et
        if: always()
        run: |
          sudo containerlab destroy -t real-lab/topology.clab.yml --cleanup || true
          remaining="$(sudo docker ps -a --format '{{.Names}}' | grep '^clab-aglab-real-mvp-' || true)"
          if [ -n "$remaining" ]; then
            echo "::error::Real-lab containers remain after cleanup:"
            echo "$remaining"
            exit 1
          fi
          echo "Real-lab cleanup verified"

  advanced-native:
    name: Native ${{ matrix.lab }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lab: [l2, routing]
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Native adaptör güvenlik ve şema testleri
        run: python3 real-lab/test_advanced_smoke.py
      - name: Containerlab kur
        run: |
          curl -fsSL https://get.containerlab.dev | sudo bash
          containerlab version
      - name: Ayrı native laboratuvarı doğrula
        run: sudo python3 real-lab/advanced_smoke.py "${{ matrix.lab }}" --execute
      - name: Native motor kanıtlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-gercek-motor-${{ matrix.lab }}
          path: dist/advanced-*-results.json
          if-no-files-found: warn

  shared-and-extended:
    name: Shared integration ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: [shared_smoke, extended_routing]
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded shared topology adapter
        run: python3 real-lab/test_shared_topology.py
      - name: Install Containerlab
        run: curl -fsSL https://get.containerlab.dev | sudo bash
      - name: Execute isolated native integration
        run: sudo python3 real-lab/${{ matrix.script }}.py --execute
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-integration-${{ matrix.script }}
          path: dist/*-results.json
          if-no-files-found: error

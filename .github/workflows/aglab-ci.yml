name: AğLab doğrulama ve paketleme

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sabit üçüncü taraf motoru derle ve doğrula
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:engine
          git diff --exit-code -- simulator/borck-engine.generated.js
          node simulator/test_borck_engine.cjs
      - name: Akademi puanlama sözleşmesini doğrula
        run: node academy/test_grading_verdict.cjs
      - name: VLAN yalıtım sağlık kapısını doğrula
        run: node academy/test_vlan_health.cjs
      - name: Routing değerlendirme kurallarını doğrula
        run: node academy/test_routing_grading.cjs
      - name: Otomatik MAC adreslerini doğrula
        run: node simulator/test_mac_address.cjs
      - name: Simülatör ve Akademi HTML derlemesini doğrula
        run: |
          python build_simulator.py
          python build_academy.py
          cp AgLab_Final_PKT_Import.html "$RUNNER_TEMP/aglab-first.html"
          python build_simulator.py
          python build_academy.py
          cmp AgLab_Final_PKT_Import.html "$RUNNER_TEMP/aglab-first.html"
          git diff --exit-code -- AgLab_Final_PKT_Import.html
      - name: Chromium ve Playwright kur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ortak motor senaryoları ve erişilebilirliği doğrula
        run: python test_aglab_network_features.py
      - name: Testleri çalıştır ve başarılıysa ZIP üret
        run: python run_pipeline.py
      - name: Test raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-test-raporlari
          path: |
            dist/test-report.md
            dist/test-results.json
            dist/student-ui.png
            dist/device-cli.png
            dist/device-cli-mobile.png
            dist/network-scenario-results.json
            dist/network-audit.md
            dist/borck-benchmark.json
            dist/borck-ui-results.json
            dist/browser-engine-benchmark.json
            dist/unified-rc-performance.json
            dist/advanced-student-journey.json
            dist/advanced-student-journey.png
            dist/html-build-manifest.json
          if-no-files-found: warn
      - name: Başarılı ZIP'i sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-dogrulanmis-paket
          path: dist/AgLab_Otomatik_Dogrulanmis_Paket.zip
          if-no-files-found: error
      - name: Ayrı öğretmen paketini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-akademi-ogretmen
          path: dist/AgLab_Akademi_Ogretmen.zip
          if-no-files-found: error


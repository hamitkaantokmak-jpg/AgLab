name: AğLab doğrulama ve paketleme

on:
  # Dal push'ları PR olayıyla zaten koşar; push yalnız main'de tetiklenir
  # (aksi halde her PR push'u iki kez koşuyordu).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Aynı dal için yeni koşu başlayınca süren eski koşu iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaynak biçimini doğrula (Prettier, Black)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check
          python -m pip install black==26.5.1
          black --check .
      - name: Dağıtılamayan materyal engeli (PDF)
        run: |
          # pdfs/ klasörü ve PDF dosyaları depoya hiçbir zaman girmez (Labber kaynak notu).
          if git ls-files | grep -Ei '(^|/)pdfs/|\.pdf$'; then
            echo "::error::PDF veya pdfs/ içeriği depoda; kaldırın." && exit 1
          fi
      - name: Labber motorunu derle, tekrar üretimi ve türleri doğrula
        run: |
          npm run build:sim
          git diff --exit-code -- src/sim.generated.js
          # TypeScript 7 hata olsa da 0 ile çıkabilir: çıktıda "error TS" aranır.
          set +e
          out="$(npx tsc -p tsconfig.sim.json --noEmit 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "error TS"; then
            echo "::error::src/sim tür denetimi başarısız" && exit 1
          fi
          npm run test:sim
      - name: Akademi puanlama sözleşmesini doğrula
        run: node tests/node/test_grading_verdict.cjs
      - name: VLAN yalıtım sağlık kapısını doğrula
        run: node tests/node/test_vlan_health.cjs
      - name: Routing değerlendirme kurallarını doğrula
        run: node tests/node/test_routing_grading.cjs
      - name: Otomatik MAC adreslerini doğrula
        run: node tests/node/test_mac_address.cjs
      - name: Simülatör ve Akademi HTML derlemesini doğrula
        run: |
          python tools/build_html.py --check
          python build_simulator.py
          python build_academy.py
          cp AgLab_Final_PKT_Import.html "$RUNNER_TEMP/aglab-first.html"
          python build_simulator.py
          python build_academy.py
          cmp AgLab_Final_PKT_Import.html "$RUNNER_TEMP/aglab-first.html"
          sha256sum -c html-build.sha256
      - name: Chromium ve Playwright kur
        timeout-minutes: 8
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ortak motor senaryoları ve erişilebilirliği doğrula
        run: python tests/test_aglab_network_features.py
      - name: Testleri çalıştır ve başarılıysa ZIP üret
        run: python run_pipeline.py
      - name: Test raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-test-raporlari
          path: |
            dist/test-report.md
            dist/test-results.json
            dist/student-ui.png
            dist/device-cli.png
            dist/device-cli-mobile.png
            dist/network-scenario-results.json
            dist/network-audit.md
            dist/unified-rc-performance.json
            dist/advanced-student-journey.json
            dist/advanced-student-journey.png
            dist/device-cli.png
            dist/device-cli-mobile.png
            dist/html-build-manifest.json
            dist/simulation-mode-results.json
            dist/simulation-desktop.png
            dist/simulation-mobile.png
            dist/simulation-details-mobile.png
          if-no-files-found: warn
      - name: Başarılı ZIP'i sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-dogrulanmis-paket
          path: dist/AgLab_Otomatik_Dogrulanmis_Paket.zip
          if-no-files-found: error
      - name: Ayrı öğretmen paketini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aglab-akademi-ogretmen
          path: dist/AgLab_Akademi_Ogretmen.zip
          if-no-files-found: error


